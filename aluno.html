<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Aluno | Instituto Vetrium</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: #f6f4ee;
    }

    .student-page {
      min-height: 100vh;
      padding: 40px 20px;
    }

    .student-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .student-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .student-top h1 {
      margin: 0;
      color: #183d2f;
    }

    .student-email {
      color: #666;
      margin-top: 8px;
    }

    .logout-btn {
      border: none;
      background: #183d2f;
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .progress-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      background: #e6e0d3;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #d5aa43;
      transition: width 0.3s ease;
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .module-card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      border: 1px solid #e8e1d3;
    }

    .module-number {
      font-size: 13px;
      color: #9a7a2f;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .module-card h3 {
      margin: 0 0 10px;
      color: #183d2f;
      font-size: 18px;
    }

    .module-status {
      font-size: 14px;
      color: #777;
      margin-bottom: 14px;
    }

    .module-btn {
      width: 100%;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      background: #d5aa43;
      color: #183d2f;
      font-weight: 700;
      cursor: pointer;
    }

    .module-btn.completed {
      background: #183d2f;
      color: white;
    }

    .certificate-box {
      margin-top: 35px;
      background: #183d2f;
      color: white;
      padding: 28px;
      border-radius: 16px;
      text-align: center;
    }

    .certificate-box h2 {
      margin-top: 0;
    }

    .certificate-box button {
      border: none;
      background: #d5aa43;
      color: #183d2f;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="student-page">
    <div class="student-container">

      <div class="student-top">
        <div>
          <p class="eyebrow">INSTITUTO VETRIUM</p>
          <h1>Área do Aluno</h1>
          <p class="student-email" id="studentEmail">
            Carregando aluno...
          </p>
        </div>

        <button class="logout-btn" id="logoutBtn">
          Sair
        </button>
      </div>

      <section class="progress-card">
        <h2>Seu progresso</h2>
        <p id="progressText">0 de 30 módulos concluídos</p>

        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </section>

      <section>
        <p class="eyebrow">CURSO DE AUXILIAR DE VETERINÁRIO</p>
        <h2>Seus 30 módulos</h2>

        <div class="modules-grid" id="modulesGrid"></div>
      </section>

      <section class="certificate-box">
        <h2>Certificado de conclusão</h2>
        <p>
          O certificado será liberado quando os 30 módulos forem concluídos.
        </p>

        <button id="certificateBtn" disabled>
          Certificado bloqueado
        </button>
      </section>

    </div>
  </main>

  <script>
    const accessToken = localStorage.getItem('vetrium_access_token');
    const studentEmail = localStorage.getItem('vetrium_user_email');

    if (!accessToken) {
      window.location.href = 'index.html#aluno';
    }

    document.getElementById('studentEmail').textContent =
      studentEmail || 'Aluno Instituto Vetrium';

    const modules = [
      'Introdução à Medicina Veterinária',
      'Ética e postura profissional',
      'Rotina de uma clínica veterinária',
      'Organização e higienização',
      'Contenção de cães e gatos',
      'Anatomia básica dos animais',
      'Fisiologia básica',
      'Sinais vitais',
      'Triagem veterinária',
      'Prontuário e ficha clínica',
      'Farmacologia básica',
      'Vias de administração',
      'Cálculo e preparo de medicações',
      'Coleta de sangue',
      'Exames laboratoriais',
      'Curativos e feridas',
      'Primeiros socorros',
      'Emergência veterinária',
      'Internação veterinária',
      'Fluidoterapia',
      'Nutrição de cães e gatos',
      'Vacinação e prevenção',
      'Doenças infectocontagiosas',
      'Parasitologia básica',
      'Dermatologia veterinária',
      'Cuidados com pacientes cirúrgicos',
      'Centro cirúrgico',
      'Anestesia veterinária',
      'Atendimento ao tutor',
      'Avaliação final do curso'
    ];

    let completedModules = [];

    const modulesGrid = document.getElementById('modulesGrid');
    const SUPABASE_URL = 'https://dsmrdpwccbmezzpgwcef.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NprxXQvjDX-AEy64Q97hwg_AOL0ZOR4';

async function loadProgress() {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/progress?select=module_id&completed=eq.true`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${accessToken}`
        }
      }
    );

    if (!response.ok) {
      throw new Error('Não foi possível carregar o progresso.');
    }

    const data = await response.json();

completedModules = data.map(item => item.module_id);
    renderModules();

  } catch (error) {
    console.error(error);
  }
}
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');
    const certificateBtn = document.getElementById('certificateBtn');

    function renderModules() {
      modulesGrid.innerHTML = '';

      modules.forEach((moduleName, index) => {
        const moduleNumber = index + 1;
        const completed = completedModules.includes(moduleNumber);

        const card = document.createElement('div');
        card.className = 'module-card';

        card.innerHTML = `
          <div class="module-number">
            Módulo ${String(moduleNumber).padStart(2, '0')}
          </div>

          <h3>${moduleName}</h3>

          <p class="module-status">
            ${completed ? 'Concluído' : locked ? '🔒 Bloqueado' : 'Acessar aula'}
          </p>

          <button
            class="module-btn ${completed ? 'completed' : ''}"
onclick="${locked ? "return false;" : `window.location.href='aula.html?modulo=${moduleNumber}'`}"          >
          ${completed ? 'Concluído' : locked ? '🔒 Bloqueado' : 'Acessar aula'}
          </button>
        `;

        modulesGrid.appendChild(card);
      });

      updateProgress();
    }

    function toggleModule(moduleNumber) {
      if (completedModules.includes(moduleNumber)) {
        completedModules = completedModules.filter(
          number => number !== moduleNumber
        );
      } else {
        completedModules.push(moduleNumber);
      }

      localStorage.setItem(
        'vetrium_completed_modules',
        JSON.stringify(completedModules)
      );

      renderModules();
    }

    function updateProgress() {
      const total = modules.length;
      const completed = completedModules.length;
      const previousCompleted = moduleNumber === 1 || completedModules.includes(moduleNumber - 1);
const locked = !previousCompleted;
      const percentage = (completed / total) * 100;

      progressText.textContent =
        `${completed} de ${total} módulos concluídos`;

      progressFill.style.width = `${percentage}%`;

      if (completed === total) {
        certificateBtn.disabled = false;
        certificateBtn.textContent = 'Certificado disponível';
      } else {
        certificateBtn.disabled = true;
        certificateBtn.textContent = 'Certificado bloqueado';
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', function() {
      localStorage.removeItem('vetrium_access_token');
      localStorage.removeItem('vetrium_refresh_token');
      localStorage.removeItem('vetrium_user_id');
      localStorage.removeItem('vetrium_user_email');

      window.location.href = 'index.html';
    });

loadProgress();
  </script>

</body>
</html>
