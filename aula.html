  <style>
    body {

    }

    }

    }

      background: #fff;

      border: 1px solid #eee7d9;
    }

      margin-top: 0;
      font-size: 30px;
    }

    .lesson-card li {
      font-size: 17px;
      line-height: 1.75;
    }

    .lesson-card li {
      margin-bottom: 8px;
    }

      background: #f5ead0;
      border-left: 5px solid #d5aa43;
    }

    .warning {
      background: #fff7e8;
      border-left: 5px solid #b57d1c;
    }

    .quiz-question {
      padding: 18px 0;
      border-bottom: 1px solid #eee7d9;
    }

    .quiz-question:last-child {
      border-bottom: 0;
    }

    .quiz-question label {
      display: block;
      margin: 10px 0;
      cursor: pointer;
    }

    .quiz-btn,
    .btn-lesson {
      border: none;
      padding: 13px 20px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-size: 15px;
    }

    .quiz-btn,
    .btn-complete {
      background: #d5aa43;
      color: #183d2f;
    }

    .btn-back {
      background: #183d2f;
      color: white;
    }

    .btn-next {
      background: white;
      color: #183d2f;
      border: 1px solid #d8d0c1;
    }

    .lesson-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    #quizResult,
    #lessonMessage {
      margin-top: 15px;
      font-weight: 700;
    }

    #completeLesson:disabled {
      opacity: .45;
      cursor: not-allowed;

</head>

let quizApproved = false;

document.getElementById('checkQuiz').addEventListener('click', function() {

  let correct = 0;

  lesson.quiz.forEach((question, questionIndex) => {

    const selected =
      document.querySelector(
        `input[name="question${questionIndex}"]:checked`
      );

    if (selected && parseInt(selected.value) === question[2]) {
      correct++;
    }
  });

  const result = document.getElementById('quizResult');

  if (correct >= 2) {

    quizApproved = true;

    result.textContent =
      `✅ Você acertou ${correct} de 3 questões. Aula liberada para conclusão.`;

    result.style.color = '#183d2f';

    document.getElementById('completeLesson').disabled = false;

  } else {

    quizApproved = false;

    result.textContent =
      `❌ Você acertou ${correct} de 3. Revise a aula e tente novamente.`;

    result.style.color = '#8b3a2e';

    document.getElementById('completeLesson').disabled = true;
  }
});

  if (!completedModules.includes(moduleNumber)) {
    completedModules.push(moduleNumber);
  }

  localStorage.setItem(
    'vetrium_completed_modules',
    JSON.stringify(completedModules)
  );

  const SUPABASE_URL_PROGRESS = 'https://dsmrdpwccbmezzpgwcef.supabase.co';
const SUPABASE_KEY_PROGRESS = 'sb_publishable_NprxXQvjDX-AEy64Q97hwg_AOL0ZOR4';
const userId = localStorage.getItem('vetrium_user_id');

const progressResponse = await fetch(
  `${SUPABASE_URL_PROGRESS}/rest/v1/progress`,

    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY_PROGRESS,
      'Authorization': `Bearer ${accessToken}`,
      'Prefer': 'resolution=merge-duplicates'

    body: JSON.stringify({

  }
);
